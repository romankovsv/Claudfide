name: exp outputs
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions: {}
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_agent: ${{ steps.decide.outputs.run_agent }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - id: decide
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          scripts/agent-gate.sh --actor "$ACTOR" --triggering-actor "$TRIGGERING_ACTOR" \
            --draft "$DRAFT" --labels "$LABELS" --head HEAD | tee -a "$GITHUB_OUTPUT"
  agent:
    needs: gate
    if: needs.gate.outputs.run_agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "agent would run"
  verify:
    needs: agent
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo verify
  guard:
    needs: agent
    if: always() && needs.agent.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - run: echo guard
  report:
    needs: [gate, agent, verify, guard]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: post what the report job sees
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT_RESULT: ${{ needs.agent.result }}
          RUN_AGENT: ${{ needs.gate.outputs.run_agent }}
          GATE_REASON: ${{ needs.gate.outputs.reason }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          body="exp2: event=${GITHUB_EVENT_NAME} action=${EVENT_ACTION} actor=[$ACTOR] triggering_actor=[$TRIGGERING_ACTOR] agent_result=[$AGENT_RESULT] run_agent=[$RUN_AGENT] reason=[$GATE_REASON]"
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
